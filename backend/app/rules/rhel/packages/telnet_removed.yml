id: RHEL-PKG-001

title: Ensure telnet-server is not installed

severity: Critical

risk_score: 9

category: Packages

description: >
  telnet-server should not be installed.

impact: >
  Telnet transmits credentials unencrypted.

supported_os:
  - rhel
  - rocky
  - alma
  - oracle_linux

supported_versions:
  - "8"
  - "9"

check:
  type: regex
  target: installed_packages
  pattern: '^telnet-server'

remediation: |
  Remove telnet-server package.

fix:

  supported: true

  safe: false

  requires_restart: false

  requires_reboot: false

  manual_review: true

  commands:
    - yum remove -y telnet-server

references:
  - CIS RHEL Benchmark

compliance:
  - CIS 2.1.1

tags:
  - insecure-packages
  - telnet