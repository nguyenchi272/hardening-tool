id: DEBIAN-AUDIT-001

title: Ensure auditd is enabled

severity: High

risk_score: 8

category: Logging

description: >
  auditd should be enabled for auditing system events.

impact: >
  Missing audit logging reduces visibility into security incidents.

supported_os:
  - debian

supported_versions:
  - "11"
  - "12"

check:
  type: regex_not_match
  target: auditd
  pattern: '^active$'

remediation: |
  Enable and start auditd service.

fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false

  commands:
    - systemctl enable auditd
    - systemctl start auditd

references:
  - CIS Debian Benchmark

compliance:
  - CIS 4.1.1

tags:
  - audit
  - logging