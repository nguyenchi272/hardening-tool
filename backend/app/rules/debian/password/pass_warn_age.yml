id: DEBIAN-PASS-001

title: Ensure password warning age is configured

severity: Medium

risk_score: 5

category: Password Policy

description: >
  Users should receive password expiration warnings.

impact: >
  Missing warnings may lead to expired accounts and operational disruption.

supported_os:
  - debian

supported_versions:
  - "11"
  - "12"

check:
  type: regex_not_match
  target: login_defs
  pattern: '^PASS_WARN_AGE\s+7'

remediation: |
  Configure PASS_WARN_AGE to at least 7 days.

fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false

  commands:
    - sed -i 's/^PASS_WARN_AGE.*/PASS_WARN_AGE 7/' /etc/login.defs

references:
  - CIS Debian Benchmark

compliance:
  - CIS 5.4.1.3

tags:
  - password
  - aging