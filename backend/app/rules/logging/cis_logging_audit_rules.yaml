id: CIS-LOG-4.1.2

title: Ensure audit rules are configured

severity: High

risk_score: 8

category: Audit & Logging

compliance:
  - CIS 4.1.2

description: >
  audit rules should be configured.

impact: >
  Missing audit rules prevent proper event tracking.

check:
  type: regex_not_match
  target: audit_rules
  pattern: '-w /etc/passwd'

remediation: |
  Add audit rules to:

  /etc/audit/rules.d/audit.rules

references:
  - CIS RHEL 8 Benchmark

tags:
  - audit
  - logging