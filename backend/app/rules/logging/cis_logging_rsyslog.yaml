id: CIS-LOG-4.2.1

title: Ensure rsyslog is enabled

severity: High

risk_score: 7

category: Audit & Logging

compliance:
  - CIS 4.2.1

description: >
  rsyslog service should be enabled.

impact: >
  Missing centralized logging weakens monitoring.

check:
  type: regex_not_match
  target: rsyslog
  pattern: '^active$'

remediation: |
  Run:

  systemctl enable rsyslog
  systemctl start rsyslog

references:
  - CIS RHEL 8 Benchmark

tags:
  - rsyslog
  - logging