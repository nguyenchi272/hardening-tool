id: CIS-KERNEL-3.3.3

title: Ensure source routed packets are disabled

severity: Medium

risk_score: 6

category: Kernel Hardening

compliance:
  - CIS 3.3.3

description: >
  Source routed packets should be disabled.

impact: >
  Source routing can bypass routing controls.

check:
  type: regex
  target: sysctl
  pattern: 'net.ipv4.conf.all.accept_source_route = 1'

remediation: |
  Edit:

  /etc/sysctl.conf

  Set:
  net.ipv4.conf.all.accept_source_route = 0

references:
  - CIS RHEL 8 Benchmark

tags:
  - kernel
  - networking