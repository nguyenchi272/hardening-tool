id: CIS-KERNEL-3.3.1

title: Ensure IP forwarding is disabled

severity: High

risk_score: 8

category: Kernel Hardening

compliance:
  - CIS 3.3.1

description: >
  IP forwarding should be disabled.

impact: >
  Enabled forwarding may allow packet routing attacks.

check:
  type: regex
  target: sysctl
  pattern: 'net.ipv4.ip_forward = 1'

remediation: |
  Edit:

  /etc/sysctl.conf

  Set:
  net.ipv4.ip_forward = 0

references:
  - CIS RHEL 8 Benchmark

tags:
  - kernel
  - networking