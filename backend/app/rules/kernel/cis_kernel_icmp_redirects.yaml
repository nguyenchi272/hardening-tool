id: CIS-KERNEL-3.3.2

title: Ensure ICMP redirects are disabled

severity: Medium

risk_score: 6

category: Kernel Hardening

compliance:
  - CIS 3.3.2

description: >
  ICMP redirects should be disabled.

impact: >
  ICMP redirects can facilitate MITM attacks.

check:
  type: regex
  target: sysctl
  pattern: 'net.ipv4.conf.all.accept_redirects = 1'

remediation: |
  Edit:

  /etc/sysctl.conf

  Set:
  net.ipv4.conf.all.accept_redirects = 0

references:
  - CIS RHEL 8 Benchmark

tags:
  - kernel
  - icmp