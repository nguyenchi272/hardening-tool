id: CIS-SELINUX-1.6.1

title: Ensure SELinux is enforcing

severity: High

risk_score: 8

category: SELinux

compliance:
  - CIS 1.6.1

description: >
  SELinux should run in enforcing mode.

impact: >
  Disabled SELinux reduces kernel-level protection.

check:
  type: equals
  target: selinux
  expected_value: Enforcing

remediation: |
  Run:

  setenforce 1

references:
  - CIS RHEL 8 Benchmark

tags:
  - selinux
  - hardening