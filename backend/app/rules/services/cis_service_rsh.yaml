id: CIS-SVC-2.1.2

title: Ensure rsh server is not enabled

severity: Critical

risk_score: 9

category: Services

compliance:
  - CIS 2.1.2

description: >
  rsh service should not be enabled.

impact: >
  rsh is insecure and sends traffic unencrypted.

check:
  type: regex
  target: enabled_services
  pattern: 'rsh'

remediation: |
  Run:

  systemctl disable rsh.socket
  systemctl stop rsh.socket

references:
  - CIS RHEL 8 Benchmark

tags:
  - services
  - rsh