id: CIS-SVC-2.1.3

title: Ensure vsftpd is not enabled

severity: High

risk_score: 8

category: Services

compliance:
  - CIS 2.1.3

description: >
  FTP server should not be enabled unless required.

impact: >
  FTP traffic may expose credentials.

check:
  type: regex
  target: enabled_services
  pattern: 'vsftpd'

remediation: |
  Run:

  systemctl disable vsftpd
  systemctl stop vsftpd

references:
  - CIS RHEL 8 Benchmark

tags:
  - ftp
  - services