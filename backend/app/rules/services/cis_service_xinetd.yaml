id: CIS-SVC-2.1.6

title: Ensure xinetd is not enabled

severity: High

risk_score: 7

category: Services

compliance:
  - CIS 2.1.6

description: >
  xinetd should not be enabled.

impact: >
  xinetd may expose legacy insecure services.

check:
  type: regex
  target: enabled_services
  pattern: 'xinetd'

remediation: |
  Run:

  systemctl disable xinetd
  systemctl stop xinetd

references:
  - CIS RHEL 8 Benchmark

tags:
  - xinetd
  - services