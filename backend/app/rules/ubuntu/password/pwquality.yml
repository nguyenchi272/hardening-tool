id: UBUNTU-PASS-002

title: Ensure password minimum length is configured

severity: High

risk_score: 7

category: Password Policy

description: >
  Password minimum length should be at least 14 characters.

impact: >
  Weak passwords are easier to brute-force.

supported_os:
  - ubuntu

supported_versions:
  - "20.04"
  - "22.04"
  - "24.04"

check:
  type: regex_not_match
  target: pwquality
  pattern: '^minlen\s*=\s*14'

remediation: |
  Configure password minimum length.

fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false

  commands:
    - sed -i 's/^minlen.*/minlen = 14/' /etc/security/pwquality.conf

references:
  - CIS Ubuntu Benchmark

compliance:
  - CIS 5.4.1.1

tags:
  - password
  - pam
  - pwquality