id: CIS-PERM-6.1.3

title: Ensure permissions on /etc/gshadow are configured

severity: High

risk_score: 8

category: File Permissions

compliance:
  - CIS 6.1.3

description: >
  /etc/gshadow permissions should be restricted.

impact: >
  Weak permissions expose group password data.

check:
  type: regex_not_match
  target: gshadow_perm
  pattern: '^(000|640)$'

remediation: |
  Run:

  chmod 000 /etc/gshadow

references:
  - CIS RHEL 8 Benchmark

tags:
  - permissions
  - gshadow