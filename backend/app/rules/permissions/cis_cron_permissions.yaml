id: CIS-FILE-CRON-001

title: Ensure permissions on /etc/crontab are configured

severity: Medium

risk_score: 5

category: File Permissions

compliance:
  - CIS 5.1.2

description: >
  The /etc/crontab file must have strict permissions
  to prevent unauthorized modification of scheduled tasks.

impact: >
  Weak permissions on /etc/crontab may allow
  attackers to modify scheduled jobs and gain persistence.

check:
  type: regex_not_match
  target: crontab_permissions
  pattern: '^600 root root$'

expected: secure_permissions

remediation: |
  Run:

  chmod 600 /etc/crontab
  chown root:root /etc/crontab

fix:
  - chmod 600 /etc/crontab
  - chown root:root /etc/crontab

references:
  - CIS RHEL 8 Benchmark
  - CIS Oracle Linux 8 Benchmark

tags:
  - file-permissions
  - cron
  - persistence
  - hardening