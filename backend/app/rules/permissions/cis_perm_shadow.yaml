id: CIS-PERM-6.1.2

title: Ensure permissions on /etc/shadow are configured

severity: Critical

risk_score: 9

category: File Permissions

compliance:
  - CIS 6.1.2

description: >
  /etc/shadow permissions should be 000 or 640.

impact: >
  Incorrect permissions expose password hashes.

check:
  type: regex_not_match
  target: shadow_perm
  pattern: '^(000|640)$'

remediation: |
  Run:

  chmod 000 /etc/shadow

references:
  - CIS RHEL 8 Benchmark

tags:
  - permissions
  - shadow