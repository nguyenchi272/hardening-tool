id: CIS-PERM-6.1.11

title: Ensure no world writable files exist

severity: High

risk_score: 8

category: File Permissions

compliance:
  - CIS 6.1.11

description: >
  World writable files should not exist.

impact: >
  World writable files may allow privilege escalation.

check:
  type: regex
  target: world_writable
  pattern: '.+'

remediation: |
  Find and remove world writable permissions:

  chmod o-w <file>

references:
  - CIS RHEL 8 Benchmark

tags:
  - permissions
  - filesystem