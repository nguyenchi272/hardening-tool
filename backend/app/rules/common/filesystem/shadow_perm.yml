id: CIS-FILE-002

title: Ensure permissions on /etc/shadow are configured

severity: Critical

risk_score: 9

category: Filesystem

description: >
  The /etc/shadow file must be protected.

impact: >
  Weak permissions expose password hashes.

supported_os:
  - rhel
  - ubuntu
  - oracle_linux

supported_versions:
  - "8"
  - "9"

check:
  type: equals
  target: shadow_perm
  expected_value: "0"

remediation: |
  Protect /etc/shadow permissions.

fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false

  commands:
    - chmod 000 /etc/shadow

references:
  - CIS Benchmark

compliance:
  - CIS 6.1.3

tags:
  - filesystem
  - passwords