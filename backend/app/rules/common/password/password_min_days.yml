id: CIS-PASS-003

title: Ensure password minimum age is configured

severity: Medium

risk_score: 5

category: Password


description: >
  Password changes should not be allowed immediately.


impact: >
  Prevents rapid password cycling to bypass history.


supported_os:

  - rhel
  - rocky
  - alma
  - oracle_linux
  - ubuntu
  - debian


supported_versions:

  - "7"
  - "8"
  - "9"


check:

  type: regex_not_match

  target: login_defs

  pattern: '^PASS_MIN_DAYS\s+1'


fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false


  commands:

    - sed -i 's/^PASS_MIN_DAYS.*/PASS_MIN_DAYS 1/' /etc/login.defs


remediation: |
  Set PASS_MIN_DAYS to 1.


references:

  - CIS Linux Benchmark


compliance:

  - CIS 5.4.1.2


tags:

  - password