id: CIS-PASS-002

title: Ensure password expiration is configured

severity: Medium

risk_score: 6

category: Password Policy

description: >
  Password expiration should be configured.

impact: >
  Long-lived passwords increase compromise risk.

supported_os:
  - rhel
  - ubuntu
  - oracle_linux

supported_versions:
  - "8"
  - "9"

check:
  type: regex_not_match
  target: login_defs
  pattern: '^PASS_MAX_DAYS\s+365'

remediation: |
  Set PASS_MAX_DAYS 365

fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false

  commands:
    - sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS 365/' /etc/login.defs

references:
  - CIS Benchmark

compliance:
  - CIS 5.5.1

tags:
  - password