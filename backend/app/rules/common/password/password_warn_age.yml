id: CIS-PASS-004

title: Ensure password expiration warning days are configured

severity: Low

risk_score: 3

category: Password


description: >
  Users should receive password expiration warnings.


impact: >
  Prevents unexpected account lockouts.


supported_os:

  - rhel
  - rocky
  - alma
  - oracle_linux
  - ubuntu
  - debian


supported_versions:

  - "7"
  - "8"
  - "9"


check:

  type: regex_not_match

  target: login_defs

  pattern: '^PASS_WARN_AGE\s+7'


fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false


  commands:

    - sed -i 's/^PASS_WARN_AGE.*/PASS_WARN_AGE 7/' /etc/login.defs


remediation: |
  Configure warning period.


references:

  - CIS Linux Benchmark


compliance:

  - CIS 5.4.1.3


tags:

  - password