id: CIS-PASS-005

title: Ensure password history is enforced

severity: Medium

risk_score: 5

category: Password


description: >
  Previous passwords should not be reused.


impact: >
  Prevents password cycling attacks.


supported_os:

  - rhel
  - rocky
  - alma
  - oracle_linux
  - ubuntu
  - debian


supported_versions:

  - "7"
  - "8"
  - "9"


check:

  type: regex_not_match

  target: pwquality

  pattern: '^remember\s*=\s*5'


fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false


  commands:

    - echo "remember=5" >> /etc/security/pwquality.conf


remediation: |
  Configure password history.


references:

  - CIS Linux Benchmark


compliance:

  - CIS 5.4.1.5


tags:

  - password