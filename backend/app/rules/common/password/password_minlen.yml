id: CIS-PASS-001

title: Ensure password minimum length is configured

severity: High

risk_score: 8

category: Password Policy

description: >
  Passwords should have a minimum length.

impact: >
  Weak passwords are easier to crack.

supported_os:
  - rhel
  - ubuntu
  - oracle_linux

supported_versions:
  - "8"
  - "9"
  - "20.04"
  - "22.04"

check:
  type: regex_not_match
  target: pwquality
  pattern: '^minlen\s*=\s*14'

remediation: |
  Configure:
  minlen = 14

fix:

  supported: true

  safe: true

  requires_restart: false

  requires_reboot: false

  manual_review: false

  commands:
    - sed -i 's/^minlen.*/minlen = 14/' /etc/security/pwquality.conf

references:
  - CIS Benchmark

compliance:
  - CIS 5.4.1

tags:
  - password
  - authentication