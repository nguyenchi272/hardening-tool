id: CIS-LOG-002

title: Ensure rsyslog is enabled

severity: Medium

risk_score: 6

category: Logging

description: >
  rsyslog should be enabled and running.

impact: >
  Missing centralized logging reduces monitoring capability.

supported_os:
  - rhel
  - ubuntu
  - oracle_linux

supported_versions:
  - "7"
  - "8"
  - "9"

check:
  type: regex_not_match
  target: rsyslog
  pattern: '^active'

remediation: |
  Enable and start rsyslog service.

fix:

  supported: true

  safe: true

  requires_restart: true

  requires_reboot: false

  manual_review: false

  commands:
    - systemctl enable rsyslog
    - systemctl start rsyslog

references:
  - CIS Benchmark

compliance:
  - CIS 4.2.1

tags:
  - logging
  - monitoring