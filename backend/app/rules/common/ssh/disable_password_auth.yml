id: CIS-SSH-002

title: Ensure password authentication is disabled

severity: High

risk_score: 8

category: SSH

description: >
  SSH password authentication should be disabled.

impact: >
  Password authentication increases brute-force attack risk.

supported_os:
  - rhel
  - ubuntu
  - oracle_linux

supported_versions:
  - "8"
  - "9"
  - "20.04"
  - "22.04"

check:
  type: regex
  target: sshd_config
  pattern: '^PasswordAuthentication\s+yes'

remediation: |
  Disable SSH password authentication.

fix:

  supported: true

  safe: false

  requires_restart: true

  requires_reboot: false

  manual_review: true

  commands:
    - sed -i 's/^PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
    - systemctl restart sshd

references:
  - CIS Benchmark

compliance:
  - CIS 5.2.7

tags:
  - ssh
  - hardening