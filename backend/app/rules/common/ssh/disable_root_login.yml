id: CIS-SSH-001

title: Ensure root login is disabled

severity: Critical

risk_score: 10

category: SSH

description: >
  Root SSH login should be disabled.

impact: >
  Attackers may brute-force the root account.

supported_os:
  - rhel
  - rocky
  - alma
  - oracle_linux
  - ubuntu

supported_versions:
  - "7"
  - "8"
  - "9"
  - "20.04"
  - "22.04"

check:
  type: regex
  target: sshd_config
  pattern: '^PermitRootLogin\s+yes'

remediation: |
  Edit:
  /etc/ssh/sshd_config

  Set:
  PermitRootLogin no

fix:

  supported: true

  safe: false

  requires_restart: true

  requires_reboot: false

  manual_review: true

  commands:
    - sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
    - systemctl restart sshd

references:
  - CIS Benchmark

compliance:
  - CIS 5.2.8

tags:
  - ssh
  - authentication