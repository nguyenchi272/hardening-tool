id: CIS-SSH-5.2.12

title: Ensure MaxAuthTries is configured

severity: High

risk_score: 8

category: SSH Hardening

compliance:
  - CIS 5.2.12

description: >
  SSH MaxAuthTries should be 4 or less.

impact: >
  Unlimited login attempts increase brute-force risk.

check:
  type: regex_not_match
  target: sshd_config
  pattern: '^MaxAuthTries\s+[1-4]'

remediation: |
  Edit:

  /etc/ssh/sshd_config

  Set:
  MaxAuthTries 4

fix:
  - grep -q '^MaxAuthTries' /etc/ssh/sshd_config && sed -i 's/^MaxAuthTries.*/MaxAuthTries 4/' /etc/ssh/sshd_config || echo 'MaxAuthTries 4' >> /etc/ssh/sshd_config
  - systemctl restart sshd

references:
  - CIS RHEL 8 Benchmark

tags:
  - ssh
  - brute-force