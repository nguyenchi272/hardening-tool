id: CIS-SSH-5.2.13

title: Ensure LoginGraceTime is configured

severity: Medium

risk_score: 6

category: SSH Hardening

compliance:
  - CIS 5.2.13

description: >
  LoginGraceTime should be 60 seconds or less.

impact: >
  Long grace times allow attackers more time.

check:
  type: regex_not_match
  target: sshd_config
  pattern: '^LoginGraceTime\s+(60|30)'

remediation: |
  Edit:

  /etc/ssh/sshd_config

  Set:
  LoginGraceTime 60

references:
  - CIS RHEL 8 Benchmark

tags:
  - ssh
  - authentication