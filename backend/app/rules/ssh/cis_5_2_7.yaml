id: CIS-SSH-5.2.7

title: Disable empty passwords

severity: Critical

risk_score: 9

category: SSH

compliance:
  - CIS 5.2.7

description: >
  SSH must not allow empty passwords.

impact: >
  Attackers can login without valid credentials.

check:
  type: regex
  target: sshd_config
  pattern: 'PermitEmptyPasswords yes'

expected: not_found

remediation: |
  Edit /etc/ssh/sshd_config

  Set:
  PermitEmptyPasswords no

references:
  - CIS Red Hat Enterprise Linux 8 Benchmark

tags:
  - ssh
  - authentication