id: CIS-SSH-5.2.6

title: Disable X11 forwarding

severity: Medium

risk_score: 5

category: SSH

compliance:
  - CIS 5.2.6

description: >
  X11 forwarding should be disabled.

impact: >
  X11 traffic may expose graphical sessions remotely.

check:
  type: regex
  target: sshd_config
  pattern: 'X11Forwarding yes'

expected: not_found

remediation: |
  Edit /etc/ssh/sshd_config

  Set:
  X11Forwarding no

references:
  - CIS RHEL 8 Benchmark

tags:
  - ssh