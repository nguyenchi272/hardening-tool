id: CIS-SSH-5.2.14

title: Ensure ClientAliveInterval is configured

severity: Medium

risk_score: 5

category: SSH Hardening

compliance:
  - CIS 5.2.14

description: >
  SSH idle timeout should be configured.

impact: >
  Idle sessions increase unauthorized access risk.

check:
  type: regex_not_match
  target: sshd_config
  pattern: '^ClientAliveInterval\s+300'

remediation: |
  Edit:

  /etc/ssh/sshd_config

  Set:
  ClientAliveInterval 300

fix:
  - grep -q '^ClientAliveInterval' /etc/ssh/sshd_config && sed -i 's/^ClientAliveInterval.*/ClientAliveInterval 300/' /etc/ssh/sshd_config || echo 'ClientAliveInterval 300' >> /etc/ssh/sshd_config
  - systemctl restart sshd

references:
  - CIS RHEL 8 Benchmark

tags:
  - ssh
  - session